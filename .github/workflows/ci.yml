name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Whisper is loaded lazily on the first transcription, so the API and
      # processing tests run without the speech model or a GPU.
      - run: pip install fastapi "uvicorn[standard]" python-multipart pydantic httpx pytest
      - run: pytest tests
